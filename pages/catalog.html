<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — SkynetStore</title>
    <meta name="description" content="Parcourez notre catalogue complet de produits électroniques IA : enceintes, robots, drones, wearables et plus.">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="container header-inner">
            <a href="../index.html" class="logo"><span class="logo-icon">⬡</span> SkynetStore</a>
            <nav class="nav" id="nav">
                <a href="../index.html" class="nav-link">Accueil</a>
                <a href="catalog.html" class="nav-link active">Catalogue</a>
                <a href="../index.html#featured" class="nav-link">Populaires</a>
                <a href="../index.html#about" class="nav-link">À propos</a>
                <a href="../index.html#contact" class="nav-link">Contact</a>
            </nav>
            <div class="header-actions">
                <div class="search-wrapper">
                    <input type="text" class="search-input" id="search-input" placeholder="Rechercher..." autocomplete="off">
                    <div class="search-results" id="search-results"></div>
                </div>
                <a href="account.html" class="nav-link account-link" id="account-link">Mon Compte</a>
                <button class="cart-btn" id="cart-btn" aria-label="Panier">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-count" id="cart-count">0</span>
                </button>
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Catalog Hero -->
    <section class="page-hero">
        <div class="container">
            <h1 class="page-title">Notre Catalogue</h1>
            <p class="page-subtitle">Explorez plus de 500 produits electroniques propulses par l'IA</p>
        </div>
    </section>

    <!-- Catalog Content -->
    <section class="catalog section">
        <div class="container">
            <div class="catalog-layout">
                <!-- Filters Sidebar -->
                <aside class="catalog-filters" id="catalog-filters">
                    <div class="filter-group">
                        <h4>Catégories</h4>
                        <label class="filter-option">
                            <input type="radio" name="category" value="all" checked> Tous les produits
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="enceintes"> Enceintes IA
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="robots"> Robots & Drones
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="wearables"> Wearables IA
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="maison"> Maison Connectée
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="audio"> Audio IA
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="gadgets"> Gadgets IA
                        </label>
                    </div>
                    <div class="filter-group">
                        <h4>Prix</h4>
                        <label class="filter-option">
                            <input type="radio" name="price" value="all" checked> Tous les prix
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="price" value="0-50"> Moins de 50€
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="price" value="50-100"> 50€ - 100€
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="price" value="100-200"> 100€ - 200€
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="price" value="200+"> Plus de 200€
                        </label>
                    </div>
                    <div class="filter-group">
                        <h4>Tri</h4>
                        <select id="sort-select" class="filter-select">
                            <option value="popular">Popularité</option>
                            <option value="price-asc">Prix croissant</option>
                            <option value="price-desc">Prix décroissant</option>
                            <option value="name">Nom A-Z</option>
                        </select>
                    </div>
                </aside>

                <!-- Products Grid -->
                <div class="catalog-main">
                    <div class="catalog-toolbar">
                        <span class="results-count" id="results-count">0 produits</span>
                        <button class="filter-toggle-btn" id="filter-toggle-btn">Filtres ☰</button>
                    </div>
                    <div class="products-grid" id="catalog-products">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Votre Panier</h3>
            <button class="cart-close" id="cart-close">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <p class="cart-empty">Votre panier est vide</p>
        </div>
        <div class="cart-footer" id="cart-footer" style="display:none;">
            <div class="cart-total">
                <span>Total :</span>
                <span id="cart-total-price">0,00 €</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-block">Commander</a>
        </div>
    </aside>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 SkynetStore. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/firebase-db.js"></script>

    <script src="../js/products.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/catalog.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
